<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Sender</title><style>body{font-family:system-ui;max-width:850px;margin:40px auto;padding:0 20px;color:#172033}main{border:1px solid #d9e1ec;border-radius:12px;padding:24px;box-shadow:0 4px 18px #17203312}label{display:block;margin:14px 0 6px;font-weight:600}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bcc8d8;border-radius:6px}textarea{min-height:110px}button{margin:16px 8px 0 0;padding:10px 16px;border:0;border-radius:6px;background:#315a8a;color:white;cursor:pointer}.secondary{background:#607086}pre{background:#f3f6f9;padding:14px;border-radius:6px;white-space:pre-wrap}small{color:#607086}</style></head>
<body><main><h1>Personalized Certificate Sender</h1><p>Upload a CSV with <b>name</b> and <b>email</b> columns. Use <code>{{name}}</code> and <code>{{email}}</code> in the email fields.</p><form id="form"><label>Participants CSV</label><input type="file" name="csv" accept=".csv" required><label>Email subject</label><input name="subject" value="Your certificate of participation"><label>Email body</label><textarea name="body">Hello {{name}},

Thank you for participating. Your personalized certificate is attached.

Best regards</textarea><button type="button" class="secondary" id="preview">Preview / dry run</button><button type="submit">Send certificates</button></form><p><small>Only send certificates to people who expect them. Provider quotas and policies apply; this tool does not bypass sending limits.</small></p><pre id="output">Results will appear here.</pre></main><script>const form=document.querySelector('#form'),out=document.querySelector('#output');async function call(url){const r=await fetch(url,{method:'POST',body:new FormData(form)});const d=await r.json();out.textContent=JSON.stringify(d,null,2)}document.querySelector('#preview').onclick=()=>call('/api/preview');form.onsubmit=e=>{e.preventDefault();if(confirm('Send individualized certificates to the valid CSV recipients?'))call('/api/send')}</script></body></html>
